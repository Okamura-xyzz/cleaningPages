<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>週間勉強計画＆問題集トラッカー</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --danger: #dc2626;
      --today: #fef9c3;
      --today-border: #eab308;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #fff;
      padding: 22px 16px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 0.82rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      font-weight: 600;
    }

    .nav-links a.active {
      background: #fff;
      color: #1e3a8a;
    }

    h1 { margin: 0 0 4px; font-size: 1.45rem; }
    .subtitle { margin: 0; opacity: 0.92; font-size: 0.9rem; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    button:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    button.primary:hover { background: #1d4ed8; }

    button.danger {
      color: var(--danger);
      border-color: #fecaca;
      background: #fff5f5;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin: 14px 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .stat-value {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label { font-size: 0.8rem; color: var(--muted); }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .view-switcher {
      display: inline-flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }

    .view-btn {
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 0.84rem;
      color: #334155;
    }

    .view-btn.active {
      background: #fff;
      color: var(--accent);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .week-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }

    .week-tab {
      padding: 6px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .week-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .week-header-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .week-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .week-title-input {
      font-size: 1.05rem;
      font-weight: 700;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      width: 260px;
    }

    .week-title-input:hover, .week-title-input:focus {
      border-color: var(--border);
      background: #f8fafc;
      outline: none;
    }

    .day-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .day-card.today-card {
      border-color: var(--today-border);
      box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.18);
    }

    .day-card.all-done {
      background: #f8fff9;
      border-color: #86efac;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1px dashed var(--border);
    }

    .day-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .date-title { font-weight: 700; font-size: 1rem; }

    .today-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: #fef08a;
      color: #854d0e;
      font-weight: 700;
    }

    .school-badge {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #1e40af;
      font-weight: 600;
    }

    .day-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f8fafc;
    }

    .task-item:hover { background: #f1f5f9; }
    .task-item.done { background: var(--success-soft); }

    .task-main {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .task-item input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--success);
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-content {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .book-name { font-weight: 700; font-size: 0.92rem; }

    .problem-range {
      font-size: 0.84rem;
      color: var(--accent);
      font-weight: 700;
      background: #eff6ff;
      padding: 1px 7px;
      border-radius: 5px;
    }

    .task-item.done .book-name,
    .task-item.done .problem-range {
      text-decoration: line-through;
      color: #15803d;
      background: transparent;
    }

    .task-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .icon-btn { padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; }
    .empty-msg { font-size: 0.84rem; color: var(--muted); padding: 4px 2px; }

    /* カレンダー表示 */
    .cal-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .cal-month-title { font-size: 1.15rem; font-weight: 700; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .cal-weekday {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      padding: 4px 0;
    }

    .cal-cell {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      min-height: 135px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cal-cell.outside { background: #f1f5f9; opacity: 0.55; }
    .cal-cell.today-cell { border-color: var(--today-border); background: #fffef5; }
    .cal-cell.all-done { border-color: #86efac; background: #f8fff9; }

    .cal-cell-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }

    .cal-date-num { font-weight: 700; font-size: 0.86rem; }

    .cal-add-mini {
      padding: 1px 6px;
      font-size: 0.74rem;
      border-radius: 5px;
      background: var(--accent-soft);
      color: var(--accent);
      border: none;
    }

    .cal-tasks { display: flex; flex-direction: column; gap: 4px; flex: 1; }

    .cal-pill {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      padding: 4px 6px;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: 0.75rem;
      cursor: pointer;
      line-height: 1.3;
    }

    .cal-pill.done {
      background: var(--success-soft);
      border-color: #bbf7d0;
      color: #15803d;
      text-decoration: line-through;
    }

    .cal-pill input[type="radio"] {
      margin-top: 2px;
      width: 13px;
      height: 13px;
      accent-color: var(--success);
      flex-shrink: 0;
    }

    @media (max-width: 780px) {
      .cal-grid { grid-template-columns: 1fr; }
      .cal-weekday { display: none; }
      .cal-cell { min-height: auto; }
      .cal-cell.outside { display: none; }
    }

    /* モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9000;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 14px;
      max-width: 520px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
    }

    .modal h2 { margin: 0 0 12px; font-size: 1.15rem; }
    .form-group { margin-bottom: 12px; }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--muted);
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .form-group textarea {
      min-height: 180px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .modal-footer-right { display: flex; gap: 8px; }

    #confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 9999;
    }

    .confetti {
      position: absolute;
      top: -12px;
      width: 10px;
      height: 14px;
      border-radius: 2px;
      animation: fall 1.1s ease-out forwards;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(85vh) rotate(540deg) scale(0.8); opacity: 0; }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 10000;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div id="confetti-layer"></div>
  <div id="toast" class="toast"></div>

  <header>
    <div class="container">
      <nav class="nav-links">
        <a href="index.html">清掃・生活ルーティン</a>
        <a href="index2.html" class="active">週間＆カレンダー勉強計画</a>
        <a href="study.html">デイタイムライン（時間比例）</a>
      </nav>
      <h1>週間勉強計画＆問題集トラッカー</h1>
      <p class="subtitle">問題集ベースでシンプル管理｜日の追加・AI連携コピー・JSONコピペ反映対応</p>
      <div class="toolbar">
        <button class="primary" id="add-week-btn">＋ 次の週を追加</button>
        <button id="open-paste-json-btn">JSONを貼り付けて反映</button>
        <button id="open-copy-json-btn">全JSONをコピー</button>
        <button id="export-btn">JSONダウンロード</button>
        <button id="reset-btn">初期データに戻す</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="stats-grid">
      <div class="card">
        <div class="stat-label">表示中の週の完了率</div>
        <div class="stat-value" id="week-rate">0%</div>
      </div>
      <div class="card">
        <div class="stat-label">表示中の週の達成数</div>
        <div class="stat-value" id="week-done-count">0 / 0</div>
      </div>
      <div class="card">
        <div class="stat-label">全期間の合計達成数</div>
        <div class="stat-value" id="total-done-count">0 / 0</div>
      </div>
    </section>

    <section class="control-row">
      <div class="view-switcher">
        <button class="view-btn active" data-view="list">リスト表示</button>
        <button class="view-btn" data-view="week-cal">週間カレンダー</button>
        <button class="view-btn" data-view="month-cal">月間カレンダー</button>
      </div>
      <div style="font-size: 0.82rem; color: var(--muted);">
        ※「AI用コピー」を押してチャットに貼ると、今日の項目からデイタイムライン用JSONを作れます
      </div>
    </section>

    <div id="week-controls">
      <section class="week-bar" id="week-tabs"></section>
      <section class="card week-header-card">
        <div class="week-title-group">
          <input type="text" id="week-title-input" class="week-title-input" aria-label="週のタイトル" />
          <span style="font-size: 0.78rem; color: var(--muted);">※タイトルはクリックで編集可</span>
        </div>
        <div class="day-actions">
          <button class="primary" id="add-day-btn">＋ 日を追加</button>
          <button class="danger" id="delete-week-btn">この週を削除</button>
        </div>
      </section>
    </div>

    <section id="main-view-container"></section>
  </main>

  <!-- 問題集タスク追加・編集モーダル（教科指定なし・問題集のみ） -->
  <div class="modal-backdrop" id="task-modal">
    <div class="modal">
      <h2 id="modal-title">問題集タスクを追加</h2>
      <div class="form-group">
        <label for="input-book">問題集・参考書名</label>
        <input type="text" id="input-book" placeholder="例：大学生の初等力学、TOEFL3800 Rank3、線形代数" />
      </div>
      <div class="form-group">
        <label for="input-range">番号・メモ（任意）</label>
        <input type="text" id="input-range" placeholder="例：51〜54 / 後ろから20分 / 3問" />
      </div>
      <div class="modal-footer">
        <div>
          <button class="danger" id="modal-delete" style="display: none;">削除</button>
        </div>
        <div class="modal-footer-right">
          <button id="modal-cancel">キャンセル</button>
          <button class="primary" id="modal-save">保存する</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 日追加モーダル -->
  <div class="modal-backdrop" id="day-modal">
    <div class="modal">
      <h2>この週に日を追加</h2>
      <div class="form-group">
        <label for="d-date">日付（YYYY-MM-DD）</label>
        <input type="text" id="d-date" placeholder="2026-11-30" />
      </div>
      <div class="form-group">
        <label for="d-label">表示ラベル</label>
        <input type="text" id="d-label" placeholder="月曜日（11/30）" />
      </div>
      <div class="form-group">
        <label for="d-school">メモ・時間割補足</label>
        <input type="text" id="d-school" placeholder="例：09:00-10:30 数値計算(自習可)" />
      </div>
      <div class="modal-footer">
        <div></div>
        <div class="modal-footer-right">
          <button id="d-cancel">キャンセル</button>
          <button class="primary" id="d-save">追加する</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JSON貼り付け・出力モーダル -->
  <div class="modal-backdrop" id="json-modal">
    <div class="modal">
      <h2 id="json-modal-title">JSONの貼り付け・出力</h2>
      <div class="form-group">
        <label id="json-modal-label" for="json-textarea">AIに作らせたJSONをここに貼り付けて「反映する」を押してください</label>
        <textarea id="json-textarea" placeholder='{"weeks":[...]}'></textarea>
      </div>
      <div class="modal-footer">
        <button id="json-copy-btn">テキストをコピー</button>
        <div class="modal-footer-right">
          <button id="json-cancel">閉じる</button>
          <button class="primary" id="json-apply">反映する</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "study_weekly_plan_2026_v3";
    const TODAY_ISO = "2026-11-24";

    const SCHOOL_BY_DOW = [
      "休日・復習日",
      "09:00-10:30 数値計算(自習可)",
      "1限:計算機言語処理(単語可) / 2限:情報AL(不可)",
      "2限:英語(自習可) / 午後:実験・講義 16:10終了",
      "1限:応数(自習可) / 2限:NW(不可) / 3限:応物(自習可)",
      "午前:自宅自習可 / 13:00-16:10 情報工学実験",
      "休日・じっくり"
    ];

    const DOW_NAMES = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];

    function formatIsoDate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");
      const d = String(dateObj.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function parseIsoDate(iso) {
      const [y, m, d] = (iso || TODAY_ISO).split("-").map(Number);
      return new Date(y, (m || 11) - 1, d || 24);
    }

    function addDays(iso, days) {
      const dt = parseIsoDate(iso);
      dt.setDate(dt.getDate() + days);
      return formatIsoDate(dt);
    }

    function formatDayLabel(iso) {
      const dt = parseIsoDate(iso);
      return `${DOW_NAMES[dt.getDay()]}（${dt.getMonth() + 1}/${dt.getDate()}）`;
    }

    function buildWeekDays(mondayIso, tasksMap = {}) {
      const days = [];
      for (let i = 0; i < 7; i++) {
        const iso = addDays(mondayIso, i);
        const dt = parseIsoDate(iso);
        days.push({
          id: "day-" + iso,
          date: iso,
          label: formatDayLabel(iso),
          school: SCHOOL_BY_DOW[dt.getDay()],
          tasks: tasksMap[iso] || []
        });
      }
      return days;
    }

    function createInitialData() {
      const w1Tasks = {
        "2026-11-24": [
          { id: "t-1124-p51", book: "大学生の初等力学", range: "51", done: false },
          { id: "t-1124-p52", book: "大学生の初等力学", range: "52", done: false },
          { id: "t-1124-p53", book: "大学生の初等力学", range: "53", done: false },
          { id: "t-1124-p54", book: "大学生の初等力学", range: "54", done: false },
          { id: "t-1124-en", book: "TOEFLテスト英単語3800 Rank3（後ろから）", range: "20分", done: false }
        ],
        "2026-11-25": [
          { id: "t-1125-p55", book: "大学生の初等力学", range: "55", done: false },
          { id: "t-1125-p56", book: "大学生の初等力学", range: "56", done: false },
          { id: "t-1125-en", book: "TOEFLテスト英単語3800 Rank3（後ろから）", range: "20分", done: false }
        ]
      };

      return {
        selectedWeekId: "week-1",
        viewMode: "list",
        calYear: 2026,
        calMonth: 11,
        weeks: [
          {
            id: "week-1",
            title: "今週：第1週（11/23〜11/29）",
            startDate: "2026-11-23",
            days: buildWeekDays("2026-11-23", w1Tasks)
          }
        ]
      };
    }

    function createNextWeek(weeks) {
      const lastWeek = weeks[weeks.length - 1];
      const nextMonday = lastWeek && lastWeek.startDate
        ? addDays(lastWeek.startDate, 7)
        : "2026-11-30";
      const sunday = addDays(nextMonday, 6);
      const dtStart = parseIsoDate(nextMonday);
      const dtEnd = parseIsoDate(sunday);
      const num = weeks.length + 1;

      return {
        id: "week-" + Date.now(),
        title: `第${num}週（${dtStart.getMonth() + 1}/${dtStart.getDate()}〜${dtEnd.getMonth() + 1}/${dtEnd.getDate()}）`,
        startDate: nextMonday,
        days: buildWeekDays(nextMonday)
      };
    }

    let appData = loadData();
    let modalContext = null;

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.weeks) && parsed.weeks.length > 0) {
            return { viewMode: "list", calYear: 2026, calMonth: 11, ...parsed };
          }
        }
      } catch {}
      return createInitialData();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function getCurrentWeek() {
      return appData.weeks.find(w => w.id === appData.selectedWeekId) || appData.weeks[0];
    }

    function getDayByIso(iso) {
      for (const w of appData.weeks) {
        const found = w.days.find(d => d.date === iso);
        if (found) return found;
      }
      return null;
    }

    function findOrCreateDayByIso(iso) {
      const existing = getDayByIso(iso);
      if (existing) return existing;
      const week = getCurrentWeek();
      const newDay = {
        id: "day-" + iso + "-" + Date.now(),
        date: iso,
        label: formatDayLabel(iso),
        school: SCHOOL_BY_DOW[parseIsoDate(iso).getDay()],
        tasks: []
      };
      week.days.push(newDay);
      week.days.sort((a, b) => (a.date || "").localeCompare(b.date || ""));
      return newDay;
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 2000);
    }

    function triggerConfetti() {
      const layer = document.getElementById("confetti-layer");
      const colors = ["#2563eb", "#16a34a", "#f59e0b", "#ec4899", "#06b6d4"];
      for (let i = 0; i < 24; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = (Math.random() * 0.25) + "s";
        layer.appendChild(piece);
        setTimeout(() => piece.remove(), 1400);
      }
    }

    function updateStats(currentWeek) {
      const weekTasks = currentWeek.days.flatMap(d => d.tasks || []);
      const weekDone = weekTasks.filter(t => t.done).length;
      const weekRate = weekTasks.length === 0 ? 0 : Math.round((weekDone / weekTasks.length) * 100);

      const allTasks = appData.weeks.flatMap(w => w.days.flatMap(d => d.tasks || []));
      const allDone = allTasks.filter(t => t.done).length;

      document.getElementById("week-rate").textContent = weekRate + "%";
      document.getElementById("week-done-count").textContent = `${weekDone} / ${weekTasks.length}`;
      document.getElementById("total-done-count").textContent = `${allDone} / ${allTasks.length}`;
    }

    // 今日の項目をAIに投げるためのテキストを生成してクリップボードへコピー
    function copyDayForAI(day) {
      const payload = {
        date: day.date,
        label: day.label,
        scheduleInfo: day.school || "",
        tasks: (day.tasks || []).map(t => ({
          book: t.book,
          range: t.range || "",
          done: !!t.done
        }))
      };

      const promptText = [
        "以下の日の問題集タスクをもとに、デイタイムライン（study.html）に貼り付けるJSONを作成してください。",
        "Tブレイク（休憩・切り替え時間）や食事、ドラム30分、23:45就寝、入浴なしを考慮してください。",
        "出力はJSONのみにしてください。",
        "",
        JSON.stringify(payload, null, 2)
      ].join("\n");

      navigator.clipboard?.writeText(promptText).then(() => {
        showToast(`${day.label} のAI連携用テキストをコピーしました`);
      }).catch(() => {
        openJsonModal("AI連携用テキスト（コピーしてください）", promptText, false);
      });
    }

    function toggleTaskByDate(iso, taskId) {
      const day = getDayByIso(iso);
      const task = day && day.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.done = !task.done;
      saveData();
      render();
      if (task.done) {
        triggerConfetti();
        showToast("完了！ナイス学習です");
      }
    }

    function deleteTaskByDate(iso, taskId) {
      const day = getDayByIso(iso);
      if (!day) return;
      day.tasks = day.tasks.filter(t => t.id !== taskId);
      saveData();
      render();
      showToast("削除しました");
    }

    function render() {
      const currentWeek = getCurrentWeek();
      appData.selectedWeekId = currentWeek.id;
      updateStats(currentWeek);

      document.querySelectorAll(".view-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === appData.viewMode);
      });

      document.getElementById("week-controls").style.display =
        appData.viewMode === "month-cal" ? "none" : "block";

      const tabsEl = document.getElementById("week-tabs");
      tabsEl.innerHTML = "";
      appData.weeks.forEach(w => {
        const btn = document.createElement("button");
        btn.className = "week-tab" + (w.id === currentWeek.id ? " active" : "");
        btn.textContent = w.title;
        btn.addEventListener("click", () => {
          appData.selectedWeekId = w.id;
          saveData();
          render();
        });
        tabsEl.appendChild(btn);
      });

      document.getElementById("week-title-input").value = currentWeek.title;

      const mainView = document.getElementById("main-view-container");
      mainView.innerHTML = "";

      if (appData.viewMode === "list") {
        renderListView(mainView, currentWeek);
      } else if (appData.viewMode === "week-cal") {
        renderWeekCalendarView(mainView, currentWeek);
      } else {
        renderMonthCalendarView(mainView);
      }
    }

    function renderListView(container, currentWeek) {
      (currentWeek.days || []).forEach(day => {
        const tasks = day.tasks || [];
        const allDone = tasks.length > 0 && tasks.every(t => t.done);
        const isToday = day.date === TODAY_ISO;

        const card = document.createElement("div");
        card.className = "day-card" + (allDone ? " all-done" : "") + (isToday ? " today-card" : "");

        const header = document.createElement("div");
        header.className = "day-header";
        header.innerHTML = `
          <div class="day-left">
            <span class="date-title">${day.label}</span>
            ${isToday ? '<span class="today-badge">今日</span>' : ''}
            ${day.school ? `<span class="school-badge">${day.school}</span>` : ''}
          </div>
        `;

        const actions = document.createElement("div");
        actions.className = "day-actions";

        const aiBtn = document.createElement("button");
        aiBtn.className = "add-task-btn";
        aiBtn.textContent = "AI用コピー";
        aiBtn.addEventListener("click", () => copyDayForAI(day));

        const addBtn = document.createElement("button");
        addBtn.className = "add-task-btn primary";
        addBtn.textContent = "＋ 問題集を追加";
        addBtn.addEventListener("click", () => openTaskModal(day.date, null));

        actions.appendChild(aiBtn);
        actions.appendChild(addBtn);
        header.appendChild(actions);
        card.appendChild(header);

        const list = document.createElement("div");
        list.className = "task-list";

        if (tasks.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-msg";
          empty.textContent = "予定なし（「＋ 問題集を追加」から登録できます）";
          list.appendChild(empty);
        } else {
          tasks.forEach(task => {
            const item = document.createElement("div");
            item.className = "task-item" + (task.done ? " done" : "");

            const main = document.createElement("div");
            main.className = "task-main";

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.checked = !!task.done;
            radio.addEventListener("click", (e) => {
              e.stopPropagation();
              toggleTaskByDate(day.date, task.id);
            });

            const content = document.createElement("div");
            content.className = "task-content";

            const book = document.createElement("span");
            book.className = "book-name";
            book.textContent = task.book || "問題集";
            content.appendChild(book);

            if (task.range) {
              const range = document.createElement("span");
              range.className = "problem-range";
              range.textContent = task.range;
              content.appendChild(range);
            }

            main.appendChild(radio);
            main.appendChild(content);
            main.addEventListener("click", () => toggleTaskByDate(day.date, task.id));

            const itemActions = document.createElement("div");
            itemActions.className = "task-actions";

            const editBtn = document.createElement("button");
            editBtn.className = "icon-btn";
            editBtn.textContent = "編集";
            editBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              openTaskModal(day.date, task.id);
            });

            const delBtn = document.createElement("button");
            delBtn.className = "icon-btn danger";
            delBtn.textContent = "削除";
            delBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              deleteTaskByDate(day.date, task.id);
            });

            itemActions.appendChild(editBtn);
            itemActions.appendChild(delBtn);

            item.appendChild(main);
            item.appendChild(itemActions);
            list.appendChild(item);
          });
        }

        card.appendChild(list);
        container.appendChild(card);
      });
    }

    function renderWeekCalendarView(container, currentWeek) {
      const grid = document.createElement("div");
      grid.className = "cal-grid";

      ["月", "火", "水", "木", "金", "土", "日"].forEach(w => {
        const head = document.createElement("div");
        head.className = "cal-weekday";
        head.textContent = w;
        grid.appendChild(head);
      });

      (currentWeek.days || []).forEach(day => {
        const dt = parseIsoDate(day.date);
        const isToday = day.date === TODAY_ISO;
        const tasks = day.tasks || [];
        const allDone = tasks.length > 0 && tasks.every(t => t.done);

        const cell = document.createElement("div");
        cell.className = "cal-cell" + (isToday ? " today-cell" : "") + (allDone ? " all-done" : "");

        const cellHead = document.createElement("div");
        cellHead.className = "cal-cell-head";
        cellHead.innerHTML = `<span class="cal-date-num">${dt.getMonth() + 1}/${dt.getDate()}${isToday ? " (今日)" : ""}</span>`;

        const addMini = document.createElement("button");
        addMini.className = "cal-add-mini";
        addMini.textContent = "＋";
        addMini.addEventListener("click", () => openTaskModal(day.date, null));
        cellHead.appendChild(addMini);

        const tasksBox = document.createElement("div");
        tasksBox.className = "cal-tasks";
        tasks.forEach(task => {
          tasksBox.appendChild(createCalendarTaskPill(day.date, task));
        });

        cell.appendChild(cellHead);
        cell.appendChild(tasksBox);
        grid.appendChild(cell);
      });

      container.appendChild(grid);
    }

    function renderMonthCalendarView(container) {
      const wrapper = document.createElement("div");
      wrapper.className = "card";

      const nav = document.createElement("div");
      nav.className = "cal-nav";

      const prevBtn = document.createElement("button");
      prevBtn.textContent = "← 前月";
      prevBtn.addEventListener("click", () => {
        if (appData.calMonth === 1) { appData.calMonth = 12; appData.calYear -= 1; }
        else { appData.calMonth -= 1; }
        saveData();
        render();
      });

      const title = document.createElement("div");
      title.className = "cal-month-title";
      title.textContent = `${appData.calYear}年 ${appData.calMonth}月`;

      const nextBtn = document.createElement("button");
      nextBtn.textContent = "次月 →";
      nextBtn.addEventListener("click", () => {
        if (appData.calMonth === 12) { appData.calMonth = 1; appData.calYear += 1; }
        else { appData.calMonth += 1; }
        saveData();
        render();
      });

      nav.appendChild(prevBtn);
      nav.appendChild(title);
      nav.appendChild(nextBtn);
      wrapper.appendChild(nav);

      const grid = document.createElement("div");
      grid.className = "cal-grid";

      ["月", "火", "水", "木", "金", "土", "日"].forEach(w => {
        const head = document.createElement("div");
        head.className = "cal-weekday";
        head.textContent = w;
        grid.appendChild(head);
      });

      const firstDay = new Date(appData.calYear, appData.calMonth - 1, 1);
      const startOffset = (firstDay.getDay() + 6) % 7;
      const startDate = new Date(appData.calYear, appData.calMonth - 1, 1 - startOffset);

      for (let i = 0; i < 42; i++) {
        const cellDate = new Date(startDate);
        cellDate.setDate(startDate.getDate() + i);
        const iso = formatIsoDate(cellDate);
        const isCurrentMonth = (cellDate.getMonth() + 1) === appData.calMonth;
        const isToday = iso === TODAY_ISO;
        const dayObj = getDayByIso(iso);
        const tasks = dayObj ? (dayObj.tasks || []) : [];
        const allDone = tasks.length > 0 && tasks.every(t => t.done);

        if (i >= 35 && !isCurrentMonth && i % 7 === 0) break;

        const cell = document.createElement("div");
        cell.className = "cal-cell"
          + (!isCurrentMonth ? " outside" : "")
          + (isToday ? " today-cell" : "")
          + (allDone ? " all-done" : "");

        const head = document.createElement("div");
        head.className = "cal-cell-head";
        head.innerHTML = `<span class="cal-date-num">${cellDate.getDate()}日${isToday ? " (今日)" : ""}</span>`;

        const addMini = document.createElement("button");
        addMini.className = "cal-add-mini";
        addMini.textContent = "＋";
        addMini.addEventListener("click", () => openTaskModal(iso, null));
        head.appendChild(addMini);

        const tasksBox = document.createElement("div");
        tasksBox.className = "cal-tasks";
        tasks.forEach(task => {
          tasksBox.appendChild(createCalendarTaskPill(iso, task));
        });

        cell.appendChild(head);
        cell.appendChild(tasksBox);
        grid.appendChild(cell);
      }

      wrapper.appendChild(grid);
      container.appendChild(wrapper);
    }

    function createCalendarTaskPill(iso, task) {
      const pill = document.createElement("div");
      pill.className = "cal-pill" + (task.done ? " done" : "");

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.checked = !!task.done;
      radio.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleTaskByDate(iso, task.id);
      });

      const txt = document.createElement("span");
      txt.textContent = `${task.book}${task.range ? " (" + task.range + ")" : ""}`;

      pill.addEventListener("click", () => toggleTaskByDate(iso, task.id));
      pill.addEventListener("dblclick", (e) => {
        e.stopPropagation();
        openTaskModal(iso, task.id);
      });

      pill.appendChild(radio);
      pill.appendChild(txt);
      return pill;
    }

    // タスクモーダル
    function openTaskModal(dateIso, taskId) {
      modalContext = { dateIso, taskId };
      const day = getDayByIso(dateIso);
      const task = (day && taskId) ? day.tasks.find(t => t.id === taskId) : null;

      document.getElementById("modal-title").textContent = task ? "問題集を編集" : "問題集を追加";
      document.getElementById("input-book").value = task ? task.book : "";
      document.getElementById("input-range").value = task ? (task.range || "") : "";
      document.getElementById("modal-delete").style.display = task ? "inline-flex" : "none";
      document.getElementById("task-modal").classList.add("open");
      document.getElementById("input-book").focus();
    }

    function closeTaskModal() {
      document.getElementById("task-modal").classList.remove("open");
      modalContext = null;
    }

    document.getElementById("modal-cancel").addEventListener("click", closeTaskModal);
    document.getElementById("task-modal").addEventListener("click", (e) => {
      if (e.target.id === "task-modal") closeTaskModal();
    });

    document.getElementById("modal-save").addEventListener("click", () => {
      if (!modalContext) return;
      const book = document.getElementById("input-book").value.trim() || "問題集";
      const range = document.getElementById("input-range").value.trim();
      const day = findOrCreateDayByIso(modalContext.dateIso);

      if (modalContext.taskId) {
        const task = day.tasks.find(t => t.id === modalContext.taskId);
        if (task) { task.book = book; task.range = range; }
        showToast("更新しました");
      } else {
        day.tasks.push({ id: "t-" + Date.now(), book, range, done: false });
        showToast("追加しました");
      }

      saveData();
      closeTaskModal();
      render();
    });

    document.getElementById("modal-delete").addEventListener("click", () => {
      if (!modalContext || !modalContext.taskId) return;
      deleteTaskByDate(modalContext.dateIso, modalContext.taskId);
      closeTaskModal();
    });

    // 日追加モーダル
    document.getElementById("add-day-btn").addEventListener("click", () => {
      const week = getCurrentWeek();
      const lastDay = week.days[week.days.length - 1];
      const nextIso = lastDay && lastDay.date ? addDays(lastDay.date, 1) : TODAY_ISO;
      document.getElementById("d-date").value = nextIso;
      document.getElementById("d-label").value = formatDayLabel(nextIso);
      document.getElementById("d-school").value = SCHOOL_BY_DOW[parseIsoDate(nextIso).getDay()];
      document.getElementById("day-modal").classList.add("open");
    });

    document.getElementById("d-cancel").addEventListener("click", () => {
      document.getElementById("day-modal").classList.remove("open");
    });

    document.getElementById("d-save").addEventListener("click", () => {
      const iso = document.getElementById("d-date").value.trim() || TODAY_ISO;
      const label = document.getElementById("d-label").value.trim() || formatDayLabel(iso);
      const school = document.getElementById("d-school").value.trim();
      const week = getCurrentWeek();
      week.days.push({
        id: "day-" + iso + "-" + Date.now(),
        date: iso,
        label,
        school,
        tasks: []
      });
      saveData();
      document.getElementById("day-modal").classList.remove("open");
      render();
      showToast("日を追加しました");
    });

    // JSON貼り付け・出力モーダル
    let jsonModalCanApply = true;
    function openJsonModal(title, text, canApply = true) {
      jsonModalCanApply = canApply;
      document.getElementById("json-modal-title").textContent = title;
      document.getElementById("json-modal-label").textContent = canApply
        ? "AIに作らせたJSONを貼り付けて「反映する」を押してください"
        : "以下の内容をコピーしてAIに貼り付けてください";
      document.getElementById("json-textarea").value = text;
      document.getElementById("json-apply").style.display = canApply ? "inline-flex" : "none";
      document.getElementById("json-modal").classList.add("open");
    }

    document.getElementById("open-paste-json-btn").addEventListener("click", () => {
      openJsonModal("JSONを貼り付けて反映", "", true);
    });

    document.getElementById("open-copy-json-btn").addEventListener("click", () => {
      openJsonModal("現在の週間計画JSON", JSON.stringify(appData, null, 2), false);
    });

    document.getElementById("json-copy-btn").addEventListener("click", () => {
      const val = document.getElementById("json-textarea").value;
      navigator.clipboard?.writeText(val).then(() => showToast("コピーしました"));
    });

    document.getElementById("json-cancel").addEventListener("click", () => {
      document.getElementById("json-modal").classList.remove("open");
    });

    document.getElementById("json-apply").addEventListener("click", () => {
      if (!jsonModalCanApply) return;
      try {
        const raw = document.getElementById("json-textarea").value.trim();
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.weeks) && parsed.weeks.length > 0) {
          appData = { viewMode: "list", calYear: 2026, calMonth: 11, ...parsed };
          saveData();
          document.getElementById("json-modal").classList.remove("open");
          render();
          showToast("JSONを反映しました");
        } else {
          showToast("weeks配列を含むJSONを貼ってください");
        }
      } catch {
        showToast("JSONの形式が正しくありません");
      }
    });

    document.querySelectorAll(".view-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        appData.viewMode = btn.dataset.view;
        saveData();
        render();
      });
    });

    document.getElementById("week-title-input").addEventListener("change", (e) => {
      const week = getCurrentWeek();
      week.title = e.target.value.trim() || week.title;
      saveData();
      render();
    });

    document.getElementById("add-week-btn").addEventListener("click", () => {
      const nw = createNextWeek(appData.weeks);
      appData.weeks.push(nw);
      appData.selectedWeekId = nw.id;
      saveData();
      render();
      showToast("次の週を追加しました");
    });

    document.getElementById("delete-week-btn").addEventListener("click", () => {
      if (appData.weeks.length <= 1) {
        showToast("最後の1週は削除できません");
        return;
      }
      if (confirm("現在表示中の週を削除しますか？")) {
        appData.weeks = appData.weeks.filter(w => w.id !== appData.selectedWeekId);
        appData.selectedWeekId = appData.weeks[0].id;
        saveData();
        render();
      }
    });

    document.getElementById("export-btn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "study-weekly-plan.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("JSONをダウンロードしました");
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      if (confirm("初期状態に戻しますか？")) {
        appData = createInitialData();
        saveData();
        render();
        showToast("初期データに戻しました");
      }
    });

    render();
  </script>
</body>
</html>
