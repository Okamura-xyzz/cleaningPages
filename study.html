<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>週間勉強計画＆問題集トラッカー</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --danger: #dc2626;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #fff;
      padding: 24px 16px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 0.82rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      font-weight: 600;
    }

    .nav-links a.active {
      background: #fff;
      color: #1e3a8a;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }

    .subtitle {
      margin: 0;
      opacity: 0.92;
      font-size: 0.92rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    button, .file-label {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    button:hover, .file-label:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    button.primary:hover {
      background: #1d4ed8;
    }

    button.danger {
      color: var(--danger);
      border-color: #fecaca;
      background: #fff5f5;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* 週選択タブ */
    .week-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }

    .week-tab {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .week-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .week-header-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .week-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .week-title-input {
      font-size: 1.05rem;
      font-weight: 700;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      width: 240px;
    }

    .week-title-input:hover, .week-title-input:focus {
      border-color: var(--border);
      background: #f8fafc;
      outline: none;
    }

    .day-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .day-card.all-done {
      background: #f8fff9;
      border-color: #86efac;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1px dashed var(--border);
    }

    .day-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .date-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .school-badge {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #1e40af;
      font-weight: 600;
    }

    .add-task-btn {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f8fafc;
      transition: background 0.15s ease;
    }

    .task-item:hover {
      background: #f1f5f9;
    }

    .task-item.done {
      background: var(--success-soft);
    }

    .task-main {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .task-item input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--success);
      cursor: pointer;
      flex-shrink: 0;
    }

    .subject-tag {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 6px;
      background: #e2e8f0;
      color: #1e293b;
      font-weight: 700;
      flex-shrink: 0;
    }

    .task-content {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .book-name {
      font-weight: 600;
      font-size: 0.92rem;
    }

    .problem-range {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 700;
      background: #eff6ff;
      padding: 1px 7px;
      border-radius: 5px;
    }

    .task-item.done .book-name,
    .task-item.done .problem-range {
      text-decoration: line-through;
      color: #15803d;
      background: transparent;
    }

    .task-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 6px;
    }

    .empty-msg {
      font-size: 0.84rem;
      color: var(--muted);
      padding: 6px 2px;
    }

    /* モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 14px;
      max-width: 440px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 1.15rem;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    /* 完了エフェクト用 */
    #confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 9999;
    }

    .confetti {
      position: absolute;
      top: -12px;
      width: 10px;
      height: 14px;
      border-radius: 2px;
      animation: fall 1.1s ease-out forwards;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(85vh) rotate(540deg) scale(0.8); opacity: 0; }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 10000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="confetti-layer"></div>
  <div id="toast" class="toast"></div>

  <header>
    <div class="container">
      <nav class="nav-links">
        <a href="index.html">清掃・生活ルーティン</a>
        <a href="index2.html" class="active">週間勉強計画</a>
      </nav>
      <h1>週間勉強計画＆問題集トラッカー</h1>
      <p class="subtitle">1週間ごとに管理｜問題集・問題番号・範囲を自由に編集可能</p>
      <div class="toolbar">
        <button class="primary" id="add-week-btn">＋ 次の週を追加</button>
        <button id="export-btn">計画・進捗をJSON保存</button>
        <label class="file-label">
          JSON読み込み
          <input type="file" id="import-file" accept=".json,application/json" hidden />
        </label>
        <button id="reset-btn">初期データに戻す</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="stats-grid">
      <div class="card">
        <div class="stat-label">表示中の週の完了率</div>
        <div class="stat-value" id="week-rate">0%</div>
      </div>
      <div class="card">
        <div class="stat-label">表示中の週の達成数</div>
        <div class="stat-value" id="week-done-count">0 / 0</div>
      </div>
      <div class="card">
        <div class="stat-label">全期間の合計達成数</div>
        <div class="stat-value" id="total-done-count">0 / 0</div>
      </div>
    </section>

    <section class="week-bar" id="week-tabs"></section>

    <section class="card week-header-card">
      <div class="week-title-group">
        <input type="text" id="week-title-input" class="week-title-input" aria-label="週のタイトル" />
        <span style="font-size: 0.78rem; color: var(--muted);">※タイトルはクリックで編集可</span>
      </div>
      <button class="danger" id="delete-week-btn">この週を削除</button>
    </section>

    <section id="days-container"></section>
  </main>

  <!-- 追加・編集モーダル -->
  <div class="modal-backdrop" id="task-modal">
    <div class="modal">
      <h2 id="modal-title">勉強タスクを追加</h2>
      <div class="form-group">
        <label for="input-subject">科目・ジャンル</label>
        <input type="text" id="input-subject" placeholder="例：数学、英語、物理、過去問" />
      </div>
      <div class="form-group">
        <label for="input-book">問題集・参考書名</label>
        <input type="text" id="input-book" placeholder="例：チャート式 数学II+B、システム英単語" />
      </div>
      <div class="form-group">
        <label for="input-range">問題番号・ページ範囲</label>
        <input type="text" id="input-range" placeholder="例：No.1〜25 / p.40〜48 / 例題12〜18" />
      </div>
      <div class="modal-footer">
        <button id="modal-cancel">キャンセル</button>
        <button class="primary" id="modal-save">保存する</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "study_weekly_plan_2026_v1";

    // 学校終了時間（月10:30 / 火12:10 / 水16:10 / 木15:30 / 金16:30）を反映した初期週間テンプレート
    function createInitialData() {
      return {
        selectedWeekId: "week-1",
        weeks: [
          {
            id: "week-1",
            title: "第1週（11/25〜11/29）",
            days: [
              { id: "d1", label: "水曜日（11/25）", school: "16:10終了・軽め", tasks: [
                { id: "t1", subject: "英語", book: "英単語帳", range: "No.1〜50", done: false }
              ]},
              { id: "d2", label: "木曜日（11/26）", school: "15:30終了", tasks: [
                { id: "t2", subject: "数学", book: "数学問題集", range: "例題 1〜6", done: false },
                { id: "t3", subject: "英語", book: "英文法問題集", range: "p.10〜13（No.1〜15）", done: false }
              ]},
              { id: "d3", label: "金曜日（11/27）", school: "16:30終了・軽め", tasks: [
                { id: "t4", subject: "英語", book: "英単語帳", range: "No.51〜100", done: false }
              ]},
              { id: "d4", label: "土曜日（11/28）", school: "休日・じっくり", tasks: [
                { id: "t5", subject: "数学", book: "数学問題集", range: "演習問題 1〜10", done: false },
                { id: "t6", subject: "理科/社会", book: "基礎問題精講", range: "第1章 No.1〜12", done: false }
              ]},
              { id: "d5", label: "日曜日（11/29）", school: "休日・復習日", tasks: [
                { id: "t7", subject: "復習", book: "今週間違えた問題", range: "解き直し全問", done: false }
              ]}
            ]
          },
          {
            id: "week-2",
            title: "第2週（11/30〜12/6）",
            days: [
              { id: "w2-mon", label: "月曜日（11/30）", school: "10:30終了・午後たっぷり", tasks: [
                { id: "w2-t1", subject: "数学", book: "数学問題集", range: "例題 7〜14", done: false },
                { id: "w2-t2", subject: "英語", book: "長文問題集", range: "Unit 1〜2", done: false }
              ]},
              { id: "w2-tue", label: "火曜日（12/1）", school: "12:10終了・午後ゆとり", tasks: [
                { id: "w2-t3", subject: "理科/社会", book: "基礎問題精講", range: "第2章 No.13〜24", done: false }
              ]},
              { id: "w2-wed", label: "水曜日（12/2）", school: "16:10終了・軽め", tasks: [
                { id: "w2-t4", subject: "英語", book: "英単語帳", range: "No.101〜150", done: false }
              ]},
              { id: "w2-thu", label: "木曜日（12/3）", school: "15:30終了", tasks: [
                { id: "w2-t5", subject: "数学", book: "数学問題集", range: "例題 15〜20", done: false }
              ]},
              { id: "w2-fri", label: "金曜日（12/4）", school: "16:30終了・軽め", tasks: [
                { id: "w2-t6", subject: "英語", book: "英単語帳", range: "No.151〜200", done: false }
              ]},
              { id: "w2-sat", label: "土曜日（12/5）", school: "休日・じっくり", tasks: [
                { id: "w2-t7", subject: "数学", book: "数学問題集", range: "演習問題 11〜20", done: false }
              ]},
              { id: "w2-sun", label: "日曜日（12/6）", school: "休日・復習日", tasks: [
                { id: "w2-t8", subject: "復習", book: "第2週の解き直し", range: "チェック問題すべて", done: false }
              ]}
            ]
          }
        ]
      };
    }

    function createBlankWeek(weekNum) {
      const uid = "w" + Date.now();
      return {
        id: uid,
        title: `第${weekNum}週`,
        days: [
          { id: uid + "-mon", label: "月曜日", school: "10:30終了・午後たっぷり", tasks: [] },
          { id: uid + "-tue", label: "火曜日", school: "12:10終了・午後ゆとり", tasks: [] },
          { id: uid + "-wed", label: "水曜日", school: "16:10終了・軽め", tasks: [] },
          { id: uid + "-thu", label: "木曜日", school: "15:30終了", tasks: [] },
          { id: uid + "-fri", label: "金曜日", school: "16:30終了・軽め", tasks: [] },
          { id: uid + "-sat", label: "土曜日", school: "休日・じっくり", tasks: [] },
          { id: uid + "-sun", label: "日曜日", school: "休日・復習日", tasks: [] }
        ]
      };
    }

    let appData = loadData();
    let modalContext = null; // { dayId, taskId | null }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.weeks) && parsed.weeks.length > 0) {
            return parsed;
          }
        }
      } catch {}
      return createInitialData();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function getCurrentWeek() {
      return appData.weeks.find(w => w.id === appData.selectedWeekId) || appData.weeks[0];
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 2000);
    }

    function triggerConfetti() {
      const layer = document.getElementById("confetti-layer");
      const colors = ["#2563eb", "#16a34a", "#f59e0b", "#ec4899", "#06b6d4"];
      for (let i = 0; i < 24; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = (Math.random() * 0.25) + "s";
        layer.appendChild(piece);
        setTimeout(() => piece.remove(), 1400);
      }
    }

    function updateStats(currentWeek) {
      const weekTasks = currentWeek.days.flatMap(d => d.tasks);
      const weekDone = weekTasks.filter(t => t.done).length;
      const weekRate = weekTasks.length === 0 ? 0 : Math.round((weekDone / weekTasks.length) * 100);

      const allTasks = appData.weeks.flatMap(w => w.days.flatMap(d => d.tasks));
      const allDone = allTasks.filter(t => t.done).length;

      document.getElementById("week-rate").textContent = weekRate + "%";
      document.getElementById("week-done-count").textContent = `${weekDone} / ${weekTasks.length}`;
      document.getElementById("total-done-count").textContent = `${allDone} / ${allTasks.length}`;
    }

    function render() {
      const currentWeek = getCurrentWeek();
      appData.selectedWeekId = currentWeek.id;
      updateStats(currentWeek);

      // 週タブ描画
      const tabsEl = document.getElementById("week-tabs");
      tabsEl.innerHTML = "";
      appData.weeks.forEach(w => {
        const btn = document.createElement("button");
        btn.className = "week-tab" + (w.id === currentWeek.id ? " active" : "");
        btn.textContent = w.title;
        btn.addEventListener("click", () => {
          appData.selectedWeekId = w.id;
          saveData();
          render();
        });
        tabsEl.appendChild(btn);
      });

      // 週タイトル入力欄
      const titleInput = document.getElementById("week-title-input");
      titleInput.value = currentWeek.title;

      // 曜日カード描画
      const daysContainer = document.getElementById("days-container");
      daysContainer.innerHTML = "";

      currentWeek.days.forEach(day => {
        const allDone = day.tasks.length > 0 && day.tasks.every(t => t.done);
        const card = document.createElement("div");
        card.className = "day-card" + (allDone ? " all-done" : "");

        const header = document.createElement("div");
        header.className = "day-header";
        header.innerHTML = `
          <div class="day-left">
            <span class="date-title">${day.label}</span>
            <span class="school-badge">${day.school}</span>
          </div>
        `;

        const addBtn = document.createElement("button");
        addBtn.className = "add-task-btn primary";
        addBtn.textContent = "＋ 問題を追加";
        addBtn.addEventListener("click", () => openModal(day.id, null));
        header.appendChild(addBtn);
        card.appendChild(header);

        const list = document.createElement("div");
        list.className = "task-list";

        if (day.tasks.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-msg";
          empty.textContent = "予定なし（「＋ 問題を追加」から問題集や番号を登録できます）";
          list.appendChild(empty);
        } else {
          day.tasks.forEach(task => {
            const item = document.createElement("div");
            item.className = "task-item" + (task.done ? " done" : "");

            const main = document.createElement("div");
            main.className = "task-main";

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.checked = !!task.done;
            radio.addEventListener("click", (e) => {
              e.stopPropagation();
              toggleTask(day.id, task.id);
            });

            const subj = document.createElement("span");
            subj.className = "subject-tag";
            subj.textContent = task.subject || "科目";

            const content = document.createElement("div");
            content.className = "task-content";

            const book = document.createElement("span");
            book.className = "book-name";
            book.textContent = task.book || "問題集";

            const range = document.createElement("span");
            range.className = "problem-range";
            range.textContent = task.range || "";

            content.appendChild(book);
            if (task.range) content.appendChild(range);

            main.appendChild(radio);
            main.appendChild(subj);
            main.appendChild(content);
            main.addEventListener("click", () => toggleTask(day.id, task.id));

            const actions = document.createElement("div");
            actions.className = "task-actions";

            const editBtn = document.createElement("button");
            editBtn.className = "icon-btn";
            editBtn.textContent = "編集";
            editBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              openModal(day.id, task.id);
            });

            const delBtn = document.createElement("button");
            delBtn.className = "icon-btn danger";
            delBtn.textContent = "削除";
            delBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              deleteTask(day.id, task.id);
            });

            actions.appendChild(editBtn);
            actions.appendChild(delBtn);

            item.appendChild(main);
            item.appendChild(actions);
            list.appendChild(item);
          });
        }

        card.appendChild(list);
        daysContainer.appendChild(card);
      });
    }

    function toggleTask(dayId, taskId) {
      const week = getCurrentWeek();
      const day = week.days.find(d => d.id === dayId);
      const task = day && day.tasks.find(t => t.id === taskId);
      if (!task) return;

      task.done = !task.done;
      saveData();
      render();
      if (task.done) {
        triggerConfetti();
        showToast("完了！ナイス学習です");
      }
    }

    function deleteTask(dayId, taskId) {
      const week = getCurrentWeek();
      const day = week.days.find(d => d.id === dayId);
      if (!day) return;
      day.tasks = day.tasks.filter(t => t.id !== taskId);
      saveData();
      render();
      showToast("タスクを削除しました");
    }

    function openModal(dayId, taskId) {
      modalContext = { dayId, taskId };
      const week = getCurrentWeek();
      const day = week.days.find(d => d.id === dayId);
      const task = taskId ? day.tasks.find(t => t.id === taskId) : null;

      document.getElementById("modal-title").textContent = task ? "問題集・番号を編集" : "勉強タスクを追加";
      document.getElementById("input-subject").value = task ? task.subject : "";
      document.getElementById("input-book").value = task ? task.book : "";
      document.getElementById("input-range").value = task ? task.range : "";
      document.getElementById("task-modal").classList.add("open");
      document.getElementById("input-subject").focus();
    }

    function closeModal() {
      document.getElementById("task-modal").classList.remove("open");
      modalContext = null;
    }

    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    document.getElementById("task-modal").addEventListener("click", (e) => {
      if (e.target.id === "task-modal") closeModal();
    });

    document.getElementById("modal-save").addEventListener("click", () => {
      if (!modalContext) return;
      const subject = document.getElementById("input-subject").value.trim() || "勉強";
      const book = document.getElementById("input-book").value.trim() || "問題集";
      const range = document.getElementById("input-range").value.trim();

      const week = getCurrentWeek();
      const day = week.days.find(d => d.id === modalContext.dayId);
      if (!day) return;

      if (modalContext.taskId) {
        const task = day.tasks.find(t => t.id === modalContext.taskId);
        if (task) {
          task.subject = subject;
          task.book = book;
          task.range = range;
        }
        showToast("更新しました");
      } else {
        day.tasks.push({
          id: "t-" + Date.now(),
          subject,
          book,
          range,
          done: false
        });
        showToast("追加しました");
      }

      saveData();
      closeModal();
      render();
    });

    document.getElementById("week-title-input").addEventListener("change", (e) => {
      const week = getCurrentWeek();
      week.title = e.target.value.trim() || week.title;
      saveData();
      render();
      showToast("週のタイトルを変更しました");
    });

    document.getElementById("add-week-btn").addEventListener("click", () => {
      const newWeek = createBlankWeek(appData.weeks.length + 1);
      appData.weeks.push(newWeek);
      appData.selectedWeekId = newWeek.id;
      saveData();
      render();
      showToast("新しい週を追加しました");
    });

    document.getElementById("delete-week-btn").addEventListener("click", () => {
      if (appData.weeks.length <= 1) {
        showToast("最後の1週は削除できません");
        return;
      }
      if (confirm("現在表示中の週を削除しますか？")) {
        appData.weeks = appData.weeks.filter(w => w.id !== appData.selectedWeekId);
        appData.selectedWeekId = appData.weeks[0].id;
        saveData();
        render();
        showToast("週を削除しました");
      }
    });

    document.getElementById("export-btn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "study-plan-progress.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("JSONファイルを保存しました");
    });

    document.getElementById("import-file").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed && Array.isArray(parsed.weeks) && parsed.weeks.length > 0) {
            appData = parsed;
            saveData();
            render();
            showToast("計画ファイルを読み込みました");
          }
        } catch {
          showToast("JSONの読み込みに失敗しました");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      if (confirm("編集内容と進捗を初期状態に戻しますか？")) {
        appData = createInitialData();
        saveData();
        render();
        showToast("初期データに戻しました");
      }
    });

    render();
  </script>
</body>
</html>
