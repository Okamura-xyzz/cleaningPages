<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>予定同期</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .item { border-bottom: 1px solid #ddd; padding: 6px 0; }
    .meta { font-size: 13px; color: #333; }
    .title { font-size: 14px; margin-top: 2px; }
    .week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
    .day-box { border: 1px solid #ccc; padding: 6px; min-height: 100px; font-size: 12px; }
    .day-box .item { padding: 4px 0; }
    .day-box .meta { font-size: 11px; }
    .day-box .title { font-size: 12px; }
    textarea { width: 100%; height: 120px; font-family: monospace; }
    .empty { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <div class="row">
    <button id="modeDay">一日表示</button>
    <button id="modeWeek">一週表示</button>
    <button id="prevBtn">前へ</button>
    <input type="date" id="datePicker" />
    <button id="nextBtn">次へ</button>
    <span id="rangeLabel"></span>
  </div>

  <div id="viewArea"></div>

  <h3>JSON貼付・同期（現在の表示単位に保存）</h3>
  <div class="row">
    <label>対象日: <input type="date" id="jsonTargetDate" /></label>
    <button id="saveJsonBtn">Supabaseへ保存</button>
    <span id="status"></span>
  </div>
  <textarea id="jsonInput" placeholder='[{"time":"14:00 - 15:30","subject":"プログラミング","title":"ポインター整理"}]'></textarea>

  <script>
    const SUPABASE_URL = "https://rjjbdozibxdtvshdzqqa.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_4rYLCtcZCOyvrEuLz2ksIQ_laHyb_Vj";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let mode = "day";
    let currentDate = toYMD(new Date());

    const datePicker = document.getElementById("datePicker");
    const jsonTargetDate = document.getElementById("jsonTargetDate");
    const jsonInput = document.getElementById("jsonInput");
    const viewArea = document.getElementById("viewArea");
    const rangeLabel = document.getElementById("rangeLabel");
    const statusEl = document.getElementById("status");

    function toYMD(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function addDays(ymd, delta) {
      const [y, m, d] = ymd.split("-").map(Number);
      return toYMD(new Date(y, m - 1, d + delta));
    }

    function getMonday(ymd) {
      const [y, m, d] = ymd.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      const diff = (dt.getDay() + 6) % 7;
      dt.setDate(dt.getDate() - diff);
      return toYMD(dt);
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderItemsHtml(items) {
      if (!Array.isArray(items) || items.length === 0) {
        return '<div class="empty">予定なし</div>';
      }
      return items.map((it) => {
        if (typeof it === "string") {
          return `<div class="item"><div class="title">${escapeHtml(it)}</div></div>`;
        }
        const time = escapeHtml(it.time || "");
        const subject = escapeHtml(it.subject || "");
        const title = escapeHtml(it.title || it.description || "");
        const metaParts = [time, subject].filter(Boolean).join(" / ");
        return `
          <div class="item">
            ${metaParts ? `<div class="meta">${metaParts}</div>` : ""}
            <div class="title">${title}</div>
          </div>
        `;
      }).join("");
    }

    async function fetchRecord(sc, ymd) {
      const base = sc === "week" ? getMonday(ymd) : ymd;
      const id = `${sc}:${base}`;
      const { data, error } = await sb
        .from("schedules")
        .select("data")
        .eq("id", id)
        .maybeSingle();
      if (error) throw error;
      return data ? data.data : null;
    }

    async function render() {
      datePicker.value = currentDate;
      if (!jsonTargetDate.value) jsonTargetDate.value = currentDate;
      statusEl.textContent = "読み込み中...";

      try {
        if (mode === "day") {
          rangeLabel.textContent = `表示日: ${currentDate}`;
          const rec = await fetchRecord("day", currentDate);
          viewArea.innerHTML = renderItemsHtml(rec);
          jsonInput.value = rec ? JSON.stringify(rec, null, 2) : "";
        } else {
          const mon = getMonday(currentDate);
          const sun = addDays(mon, 6);
          rangeLabel.textContent = `週: ${mon} 〜 ${sun}`;
          const rec = await fetchRecord("week", mon);
          let html = '<div class="week-grid">';
          for (let i = 0; i < 7; i++) {
            const d = addDays(mon, i);
            const dayItems = rec && typeof rec === "object" ? rec[d] : null;
            html += `<div class="day-box"><strong>${d}</strong>${renderItemsHtml(dayItems)}</div>`;
          }
          html += "</div>";
          viewArea.innerHTML = html;
          jsonInput.value = rec ? JSON.stringify(rec, null, 2) : "";
        }
        statusEl.textContent = "同期済";
      } catch (e) {
        statusEl.textContent = `エラー: ${e.message}`;
      }
    }

    document.getElementById("modeDay").onclick = () => { mode = "day"; render(); };
    document.getElementById("modeWeek").onclick = () => { mode = "week"; render(); };
    document.getElementById("prevBtn").onclick = () => {
      currentDate = addDays(currentDate, mode === "day" ? -1 : -7);
      jsonTargetDate.value = currentDate;
      render();
    };
    document.getElementById("nextBtn").onclick = () => {
      currentDate = addDays(currentDate, mode === "day" ? 1 : 7);
      jsonTargetDate.value = currentDate;
      render();
    };
    datePicker.onchange = (e) => {
      if (!e.target.value) return;
      currentDate = e.target.value;
      jsonTargetDate.value = currentDate;
      render();
    };

    document.getElementById("saveJsonBtn").onclick = async () => {
      const target = jsonTargetDate.value || currentDate;
      let parsed;
      try {
        parsed = JSON.parse(jsonInput.value);
      } catch {
        statusEl.textContent = "JSONの形式が不正です";
        return;
      }
      const baseDate = mode === "week" ? getMonday(target) : target;
      const id = `${mode}:${baseDate}`;

      statusEl.textContent = "保存中...";
      const { error } = await sb.from("schedules").upsert({
        id,
        scope: mode,
        target_date: baseDate,
        data: parsed,
        updated_at: new Date().toISOString()
      });
      if (error) {
        statusEl.textContent = `保存エラー: ${error.message}`;
      } else {
        currentDate = target;
        statusEl.textContent = `保存完了 (${id})`;
        render();
      }
    };

    render();
  </script>
</body>
</html>
